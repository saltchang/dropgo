[package]
name = "dropgo"
version = "0.2.1"
license = "MIT"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
askama = "0.16.1"
axum = { version = "0.8.9", features = ["multipart", "macros"] }
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
comrak = { version = "0.56.0", default-features = false, features = ["syntect-fancy"] }
futures = "0.3.34"
hmac = "0.13.0"
ignore = "0.4.33"
include_dir = "0.7.4"
mime_guess = "2.0.5"
object_store = { version = "0.14.2", features = ["aws"] }
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
percent-encoding = "2.3.2"
rand = "0.10.3"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "multipart", "stream", "rustls-tls", "rustls-tls-native-roots"] }
rpassword = "7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "time"] }
syntect = { version = "5.3.0", default-features = false, features = ["html", "default-themes", "default-syntaxes", "regex-fancy"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "parsing", "formatting", "macros"] }
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
toml = "1.1.8"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["limit", "trace"] }
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15.0", features = ["postgres"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1.5"
testcontainers-modules = { version = "0.15.0", features = ["blocking", "postgres"] }
