name: audit
on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo install cargo-audit --locked
      # Fails on any advisory, unmaintained or unsound crate not ignored in .cargo/audit.toml.
      - run: cargo audit --deny warnings
