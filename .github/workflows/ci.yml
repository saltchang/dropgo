name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Jobs get a read-only token unless they ask for more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - uses: Swatinem/rust-cache@v2
      # Integration tests start Postgres and the mock OIDC provider with testcontainers.
      - run: cargo test --locked
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci && npm test
        working-directory: web

  image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches Cargo.toml
        run: grep -qx "version = \"${GITHUB_REF_NAME#v}\"" Cargo.toml
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Version tags only (v0.1.0 -> 0.1.0), never latest.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/saltchang/dropgo
          flavor: latest=false
          tags: type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The release binary is the one in the image, so both are the same build.
      - run: |
          id=$(docker create "ghcr.io/saltchang/dropgo:${GITHUB_REF_NAME#v}")
          docker cp "$id:/dropgo" dropgo-linux-amd64
          docker rm "$id"
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dropgo-linux-amd64 skills/dropgo/SKILL.md
        env:
          GH_TOKEN: ${{ github.token }}
