name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Jobs get a read-only token unless they ask for more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - uses: Swatinem/rust-cache@v2
      # Integration tests start Postgres and the mock OIDC provider with testcontainers.
      - run: cargo test --locked
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci && npm test
        working-directory: web

  image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/saltchang/dropgo:${{ github.ref_name }}
            ghcr.io/saltchang/dropgo:latest
