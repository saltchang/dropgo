{% extends "share_base.html" %}
{% block title %}{{ t.s("password.title") }}{% endblock %}
{% block content %}
<div class="card-icon">{{ crate::icons::icon("lock")|safe }}</div>
<h1>{{ t.s("password.title") }}</h1>
<p class="muted">{{ t.s("password.body") }}</p>
<form method="post" action="/_dropgo/unlock/{{ share_id }}" class="stack">
<input type="hidden" name="back" value="{{ back }}">
<label>{{ t.s("password.label") }}
<input type="password" name="password" required autofocus autocomplete="current-password">
</label>
{% if let Some(e) = error %}<p class="error" role="alert">{{ e }}</p>{% endif %}
<button type="submit" class="primary">{{ t.s("password.submit") }}</button>
</form>
{% endblock %}
